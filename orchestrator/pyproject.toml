[project]
name = "autonetops-orchestrator"
version = "0.1.0"
description = "AutoNetOps IBN orchestrator: plan, evaluate timelines, decide strategy, dispatch"
requires-python = ">=3.11"
dependencies = [
    "autonetops-planner",
    "autonetops-executor",
    "autonetops-validator",
    "infrahub-sdk>=1.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
prefect = ["prefect>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ibn-orchestrate = "autonetops_orchestrator.cli:main"

[tool.uv.sources]
autonetops-planner = { workspace = true }
autonetops-executor = { workspace = true }
autonetops-validator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonetops_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
