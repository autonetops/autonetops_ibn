[project]
name = "autonetops-ibnctl"
version = "0.1.0"
description = "Break-glass plan runner: walks a Plan's stages through the executor verb contract"
requires-python = ">=3.11"
dependencies = [
    "autonetops-planner",
    "autonetops-executor",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
ibnctl = "ibnctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibnctl"]
