[project]
name = "autonetops-planner"
version = "0.1.0"
description = "AutoNetOps IBN planner: diff Infrahub artifacts, compute blast radius, emit Plans"
requires-python = ">=3.11"
dependencies = [
    "packaging>=23.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
infrahub = ["infrahub-sdk>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
autonetops-planner = "autonetops_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonetops_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
