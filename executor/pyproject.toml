[project]
name = "autonetops-executor"
version = "0.1.0"
description = "AutoNetOps IBN execution layer: drivers + transports behind a fixed verb contract"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
gnmi = ["pygnmi>=0.8"]
netconf = ["ncclient>=0.6"]
ssh = ["scrapli>=2024.1"]
http = ["httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonetops_executor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
