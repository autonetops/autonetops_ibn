{{- if and .Values.infrahub.apiToken (not .Values.infrahub.existingTokenSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autonetops-ibn.fullname" . }}
  labels:
    {{- include "autonetops-ibn.labels" . | nindent 4 }}
type: Opaque
stringData:
  INFRAHUB_API_TOKEN: {{ .Values.infrahub.apiToken | quote }}
{{- end }}
