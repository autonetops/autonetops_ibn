# CI gates for the IBN platform.
#
# Target gate set (implemented incrementally as components land):
#   1. schema-validate   — Infrahub schema files load cleanly
#   2. policy-validate   — planner/policies YAML conforms to policy schema
#   3. golden-tests      — transforms/templates render pinned outputs (infrahub/tests/golden)
#   4. unit-tests        — planner / orchestrator / executor / validator
#   5. simulation-gate   — golden topologies pass expectation checks (nightly + on-demand)
#
# Path-filtered so intent-pipeline changes don't run executor tests and vice versa.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # One job for all platform packages: executor tests build real planner
  # Steps, orchestrator depends on planner+executor+validator - splitting
  # per package just re-declares the dependency graph badly.
  python-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages (dependency order)
        run: |
          pip install -e ./validator -e ./planner -e ./executor
          pip install -e './orchestrator[dev]'
      - name: Tests (contract drift gate, verb contract, dispatch, gates)
        run: pytest planner/tests executor/tests orchestrator/tests validator/tests -q
      - name: Lint
        run: ruff check planner executor orchestrator validator tools

  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML syntax (placeholder gate)
        run: |
          python3 - <<'EOF'
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              sys.exit(0)  # runner image always has PyYAML; belt and braces
          failed = False
          for p in pathlib.Path('.').rglob('*.y*ml'):
              if '.git' in p.parts:
                  continue
              try:
                  list(yaml.safe_load_all(p.read_text()))
              except yaml.YAMLError as e:
                  print(f'INVALID YAML: {p}\n{e}')
                  failed = True
          sys.exit(1 if failed else 0)
          EOF
